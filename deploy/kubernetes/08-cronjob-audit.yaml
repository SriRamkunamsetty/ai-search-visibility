apiVersion: batch/v1
kind: CronJob
metadata:
  name: aivisibility-daily-audit
  namespace: aivisibility
  labels:
    app.kubernetes.io/name: aivisibility
    app.kubernetes.io/component: cron-audit
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: aivisibility
            app.kubernetes.io/component: cron-audit
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: auditor
              image: ghcr.io/sriramkunamsetty/ai-search-visibility:latest
              imagePullPolicy: IfNotPresent
              command: ["aivisibility", "audit", "run", "--samples", "5", "--yes"]
              envFrom:
                - configMapRef:
                    name: aivisibility-config
                - secretRef:
                    name: aivisibility-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1024Mi
              volumeMounts:
                - name: tmp-dir
                  mountPath: /tmp
          volumes:
            - name: tmp-dir
              emptyDir: {}
