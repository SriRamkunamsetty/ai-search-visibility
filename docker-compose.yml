version: "3.9"

services:
  # ============================================================================
  # AI Visibility API & Web Dashboard
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivisibility-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aivisibility:aivisibility_secret@postgres:5432/aivisibility
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aivisibility-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Background Task & Audit Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivisibility-worker
    restart: unless-stopped
    command: ["worker", "--concurrency", "4", "--poll-interval", "2.0"]
    environment:
      - DATABASE_URL=postgresql://aivisibility:aivisibility_secret@postgres:5432/aivisibility
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aivisibility-net

  # ============================================================================
  # PostgreSQL 16 Relational Persistence
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: aivisibility-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aivisibility
      POSTGRES_USER: aivisibility
      POSTGRES_PASSWORD: aivisibility_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aivisibility-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivisibility -d aivisibility"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis 7 In-Memory Cache & Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: aivisibility-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - aivisibility-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Prometheus Metrics Collector
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: aivisibility-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - aivisibility-net

  # ============================================================================
  # Grafana Monitoring Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:10.3.3
    container_name: aivisibility-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aivisibility-net

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:

networks:
  aivisibility-net:
    driver: bridge
