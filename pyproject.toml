[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-search-visibility"
version = "1.0.0"
description = "How AI assistants describe your titles: mention rate, rank, share of voice, release-date and cast accuracy, with Wilson intervals"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ner = ["spacy>=3.7"]

[project.scripts]
aivisibility = "aivisibility.cli:main"

[tool.setuptools.package-data]
aivisibility = ["schema.sql"]
