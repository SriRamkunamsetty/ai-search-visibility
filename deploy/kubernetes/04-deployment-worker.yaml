apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivisibility-worker
  namespace: aivisibility
  labels:
    app.kubernetes.io/name: aivisibility
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aivisibility
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aivisibility
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/sriramkunamsetty/ai-search-visibility:latest
          imagePullPolicy: IfNotPresent
          command: ["aivisibility", "worker", "--concurrency", "4", "--poll-interval", "2.0"]
          envFrom:
            - configMapRef:
                name: aivisibility-config
            - secretRef:
                name: aivisibility-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
